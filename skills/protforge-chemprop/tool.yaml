id: chemprop
version: "1.0"
display_name: "ChemProp 化学性质预测"
category: "序列分析"
batch: true
timeout_s: 600
params:
  - name: job_name
    type: string
    required: false
    default: ""
  - name: smiles
    type: string
    required: false
    default: ""
    description: "comma-separated SMILES, e.g. `\"CCO,c1ccccc1\"`."
  - name: model
    type: path
    required: false
    default: ""
    description: "container-visible model path. Default:"
