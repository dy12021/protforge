id: gnina
version: "1.0"
display_name: "Gnina 受体配体对接"
category: "对接"
batch: true
timeout_s: 7200
params:
  - name: receptor_pdb
    type: path
    required: false
    default: ""
    description: "absolute host path or filename under inputs/."
  - name: smiles
    type: string
    required: false
    default: ""
    description: "ligand SMILES string (quote it)."
  - name: job_name
    type: string
    required: false
    default: ""
  - name: center_x
    type: string
    required: false
    default: ""
  - name: center_y
    type: string
    required: false
    default: ""
  - name: center_z
    type: string
    required: false
    default: ""
  - name: box_size
    type: string
    required: false
    default: "25."
    description: "cubic box edge in Å, default 25."
